[build-system]
# numpy>=2.0 is required for dependency('numpy') support in meson.build
requires = ["meson-python>=0.15.0", "numpy>=2.0", "pybind11"]
build-backend = "mesonpy"

[project]
name = "molsim"
version = "0.6.0"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-pep8",
    "flake8",
    "black"
]
